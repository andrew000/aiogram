name: "Deploy"

on:
  push:
    tags:
      - 'v3.*'

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build source distribution
        run: uv build --sdist

      - name: Publish artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*

  build-wheels:
    name: Build ${{ matrix.python-version }} wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13
          - macos-14
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: auto
          args: --release --out dist --interpreter python

      - name: Try install wheel
        shell: bash
        run: |
          python -m venv try_install
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            try_install/Scripts/python -m pip install dist/aiogram-*.whl
            try_install/Scripts/python -c "import aiogram; from aiogram.client.session.rust import RustSession; RustSession(); print(aiogram.__version__)"
          else
            try_install/bin/python -m pip install dist/aiogram-*.whl
            try_install/bin/python -c "import aiogram; from aiogram.client.session.rust import RustSession; RustSession(); print(aiogram.__version__)"
          fi

      - name: Publish artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*

  publish:
    name: Publish
    needs:
      - build-sdist
      - build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aiogram/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
